{% extends 'base.html' %}
{% load static %}

{% block title %}Message Sent – Vanguard Labs{% endblock %}

{% block content %}
<section class="py-20 px-4 md:px-8">
    <div class="max-w-2xl mx-auto text-center">
        <div class="glass p-12 rounded-3xl">
            <i class="fas fa-check-circle text-green-400 text-6xl mb-6"></i>
            <h1 class="text-3xl md:text-4xl font-bold text-white">Message Sent!</h1>
            <p class="text-white/60 mt-4">Thank you for reaching out. We'll get back to you within 24 hours.</p>
            <a href="{% url 'core:home' %}" class="inline-block mt-8 px-8 py-3 rounded-full bg-gradient-to-r from-blue-600 to-violet-600 text-white font-medium hover:shadow-lg hover:shadow-blue-500/30 transition">Back Home</a>
        </div>
    </div>
</section>
{% endblock %}
