{% extends 'base.html' %}
{% load static %}

{% block title %}Notification Preferences – Vanguard Labs{% endblock %}

{% block content %}
<section class="py-20 px-4 md:px-8">
  <div class="max-w-3xl mx-auto">
    <div class="glass p-8 md:p-10 rounded-3xl fade-in">
      <h1 class="text-3xl font-bold text-white text-center">Notification Preferences</h1>
      <p class="text-center text-white/50 mt-1">Choose how you want to receive notifications</p>
      <form method="post" class="mt-8">
        {% csrf_token %}
        <div class="space-y-6">
          {% for field in form %}
            <div class="flex items-center justify-between p-4 glass-light rounded-xl">
              <label for="{{ field.id_for_label }}" class="text-white">{{ field.label }}</label>
              <div class="relative inline-block w-10 mr-2 align-middle">
                {{ field }}
              </div>
            </div>
          {% endfor %}
        </div>
        <button type="submit" class="w-full mt-8 py-3 rounded-full bg-gradient-to-r from-blue-600 to-violet-600 text-white font-medium hover:shadow-lg transition">Save Preferences</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
